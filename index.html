    async function initCloudBackend() {
      try {
        if (typeof __firebase_config === 'undefined' || !__firebase_config) {
          updateBackendStatusUI('LOCAL SIMULATION MODE', false);
          return;
        }
        const firebaseConfig = JSON.parse(__firebase_config);
        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        onAuthStateChanged(auth, (user) => {
          currentUser = user;
          if (user) {
            isBackendConnected = true;
            const uidEl = document.getElementById('backendOperatorUid');
            if (uidEl) uidEl.textContent = user.uid;
            updateBackendStatusUI('CLOUD SYNC: LIVE', true);
            subscribeToTelemetryBackend();
            subscribeToMissionControlBackend();
          }
        });
      } catch (err) {
        updateBackendStatusUI('EDGE CACHE MODE', false);
      }
    }

    function updateBackendStatusUI(text, connected) {
      const headerText = document.getElementById('cloudSyncHeaderText');

      if (headerText) headerText.textContent = text;

    function subscribeToTelemetryBackend() {
      if (!currentUser || !db) return;
      const crewCollectionRef = collection(db, 'artifacts', appId, 'public', 'data', 'astronaut_telemetry');

      onSnapshot(
        crewCollectionRef,
        (snapshot) => {
          if (snapshot.empty) {
            pushFullStateToBackend(false);
            return;
          }
          snapshot.forEach((docSnap) => {
            const remoteData = docSnap.data();
            const idx = crewData.findIndex((c) => c.id === docSnap.id);
            if (idx !== -1 && remoteData) {
              crewData[idx] = { ...crewData[idx], ...remoteData };
            }
          });
          const docCountEl = document.getElementById('backendDocCount');
          if (docCountEl) docCountEl.textContent = `${snapshot.size} / ${crewData.length} SYNCED`;
          renderAll();
        },
        () => {
          updateBackendStatusUI('SYNC RETRYING', false);
        }
      );
    }

    // Subscribe to shared mission control state (anomalies, encryption epoch, logs, privacy mode)
    function subscribeToMissionControlBackend() {
      if (!currentUser || !db) return;
      const missionStateRef = doc(db, 'artifacts', appId, 'public', 'data', 'mission_control', 'global_state');

      onSnapshot(
        missionStateRef,
        (docSnap) => {
          if (!docSnap.exists()) {
            syncMissionControlToBackend();
            return;
          }
          const state = docSnap.data();
          if (!state) return;

          // Sync Active Anomaly Banner across clients
          const banner = document.getElementById('anomalyBanner');
          if (state.activeAnomaly && banner) {
            activeAnomaly = state.activeAnomaly;
            const titleEl = document.getElementById('anomalyTitle');
            const descEl = document.getElementById('anomalyDesc');
            if (titleEl) titleEl.textContent = state.activeAnomaly.bannerTitle || state.activeAnomaly.title;
            if (descEl) descEl.textContent = state.activeAnomaly.desc || '';
            banner.classList.remove('hidden');
          } else if (!state.activeAnomaly && banner) {
            activeAnomaly = null;
            banner.classList.add('hidden');
          }

          // Sync Cryptographic Session Key Epoch
          if (state.sessionKeyId && typeof sessionKeyId !== 'undefined' && state.sessionKeyId !== sessionKeyId) {
            sessionKeyId = state.sessionKeyId;
            const keyWidgetEl = document.getElementById('widgetSessionKey');
            const keyModalEl = document.getElementById('modalSessionKey');
            if (keyWidgetEl) keyWidgetEl.textContent = sessionKeyId;
            if (keyModalEl) keyModalEl.textContent = sessionKeyId;
          }

          // Sync RBAC Anonymization Mode across consoles
          if (typeof state.isAnonymizedView === 'boolean' && typeof isAnonymizedView !== 'undefined' && state.isAnonymizedView !== isAnonymizedView) {
            isAnonymizedView = state.isAnonymizedView;
            updatePrivacyToggleUI();
          }

          // Sync Flight Surgeon Console Logs
          if (Array.isArray(state.recentLogs)) {
            renderSyncedLogs(state.recentLogs);
          }

          renderAll();
        },
        () => {
          // Keep local mission control state active on transient error
        }
      );
    }

    async function syncMissionControlToBackend(extraLogEntry = null) {
      if (!currentUser || !db) return;
      try {
        const missionStateRef = doc(db, 'artifacts', appId, 'public', 'data', 'mission_control', 'global_state');
        const payload = {
          activeAnomaly: activeAnomaly || null,
          sessionKeyId: typeof sessionKeyId !== 'undefined' ? sessionKeyId : 'SDLS-K256-09F4A',
          isAnonymizedView: typeof isAnonymizedView !== 'undefined' ? isAnonymizedView : false,
          selectedCrewId: selectedCrewId,
          updatedBy: currentUser.uid,
          updatedAt: new Date().toISOString()
        };
        if (extraLogEntry) {
          window._syncedLogsCache = [extraLogEntry, ...(window._syncedLogsCache || [])].slice(0, 18);
          payload.recentLogs = window._syncedLogsCache;
        } else if (window._syncedLogsCache) {
          payload.recentLogs = window._syncedLogsCache;
        }
        await setDoc(missionStateRef, payload, { merge: true });
      } catch (e) {
        // Fallback gracefully to local state
      }
    }

    function renderSyncedLogs(logs) {
      const consoleEl = document.getElementById('surgeonLogConsole');
      if (!consoleEl || !Array.isArray(logs) || logs.length === 0) return;
      window._syncedLogsCache = logs;
      consoleEl.innerHTML = '';
      logs.forEach((entry) => {
        const div = document.createElement('div');
        div.className = `flex items-start gap-2 leading-relaxed ${entry.colorClass || 'text-slate-300'}`;
        div.innerHTML = `<span class="text-slate-500 shrink-0">[${entry.timestamp}]</span><span>${entry.message}</span>`;
        consoleEl.appendChild(div);
      });
    }

      if (!currentUser || !db || !member) return;
      try {
        const memberDocRef = doc(db, 'artifacts', appId, 'public', 'data', 'astronaut_telemetry', member.id);
        await setDoc(memberDocRef, {
          ...member,
          updatedBy: currentUser.uid,

          lastSyncEl.textContent = new Date().toISOString().substring(11, 19) + ' UTC';
        }
      } catch (e) {
        // Retain local edge state gracefully if network is unavailable
      }
    }
